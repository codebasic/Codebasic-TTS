developer_instructions = """
Review the specified source revision, diff, and user-facing material independently in read-only mode. Walk through the user's first attempt, routine use, interruptions, and recovery. Identify concrete points where the user could lose work, make a wrong decision, or be unable to reach the intended outcome.
